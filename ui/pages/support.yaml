page_id: support
title: Support
description: Where to report a problem, ask a question or request a feature.
project_scoped: false
components:
- component_id: support_contact
  type: markdown
  title: Contact the developers
  body: |
    This extension is maintained in a public GitHub repository. Use it to report a problem, ask a question or request a feature; the developers answer there.

    - [Report a problem or request a feature](https://github.com/Flow-Steward/ext-operations-freightutils/issues/new/choose)
    - [Browse existing issues](https://github.com/Flow-Steward/ext-operations-freightutils/issues)
    - [Documentation and source code](https://github.com/Flow-Steward/ext-operations-freightutils)

    Questions about FreightUtils data, plans or your account go to FreightUtils: contact@freightutils.com.
- component_id: support_report
  type: markdown
  title: What to include in a report
  body: |
    - The extension version and your Flow Steward version.
    - The step, its inputs, what you expected and what happened, with the exact error message.
    - When it happened.

    Issues are public. Never include your FreightUtils API key or customer data.
