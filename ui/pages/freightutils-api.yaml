components:
- component_id: api_overview
  type: markdown
  title: How the steps work
  body: |
    Every operation of the FreightUtils API has its own step: **40 steps**, plus 5 everyday shortcuts and **Test connection**. Every step reads; none changes anything in FreightUtils or anywhere else.

    - **Sources travel with the values.** Each answer comes back whole in `data`, with its `_source` block in `source` (and `citation` where FreightUtils gives one). FreightUtils' terms let you store, show and cite answers when the source line stays beside the values.
    - **Allowance.** Each step is one request. Without an API key FreightUtils answers 25 requests a day per address; a free key gives 100 a day and Pro 50,000 a month. Every step returns `rate_limit` with what is left. When the allowance is spent the step fails with `rate_limited` and says when it resets; it is not repeated automatically.
    - **Fresh data.** `upstream` says whether a dataset behind the answer missed its update check; then a warning says so. With **If data is stale** set to `refuse` the step fails with `stale_data` instead.
    - **ADR editions.** ADR 2027 applies from 1 January 2027; ADR 2025 may still be used until 30 June 2027. Set **Edition** or **Date** when the date of carriage matters.
    - **Lists** come one page at a time (`offset`, `limit`, `cursor`), as FreightUtils serves them.

    The steps by group:

    - **Dangerous goods (ADR)** (8 steps): UN numbers, the ADR 1.1.3.6 exemption, limited and excepted quantities, consignment checks, Table A codes and what ADR 2027 changes.
    - **Freight calculators** (6 steps): Loading metres, CBM, chargeable weight, pallet fitting, unit conversion and ISO 14083 / GLEC emissions.
    - **Consignments and bookings** (4 steps): Whole loads at once: totals per line, a shipment summary, a booking check and the consignment object.
    - **Customs and tariffs** (5 steps): HS codes, UK duty and VAT, EU TARIC measures and duty, and the ICS2 goods description check.
    - **Locations and carriers** (4 steps): UN/LOCODE transport locations, airports, the nearest airports to a point and airline codes.
    - **Equipment** (3 steps): Shipping containers, air cargo ULDs and road vehicles and trailers.
    - **Identifiers and references** (5 steps): Container, air waybill and IMO number checks, free-text resolution, Incoterms 2020 and customs code lists.
    - **Check receipts** (2 steps): Read the receipt a check stored for your key, or confirm that a receipt exists.
    - **Data sources and changes** (3 steps): Which datasets FreightUtils serves, their licensing and what changed in them.
- component_id: steps_everyday
  type: markdown
  title: Everyday (6)
  body: |
    - **Test connection** — Checks that FreightUtils answers with this connection's API key (or without one) and returns the request allowance. Uses one request of the allowance. (`test_connection`)
    - **Look up UN number** — Reads the ADR entry of one UN number: name, class, packing group, labels, tunnel code and transport category. (`look_up_un_number`)
    - **Look up HS code** — Reads one HS 2022 code with its description, parents and children. (`look_up_hs_code`)
    - **Look up location code** — Reads one UN/LOCODE: the place, its country, functions and coordinates. (`look_up_location_code`)
    - **Validate container number** — Checks the check digit of a container number (ISO 6346) and reads its owner prefix and category. (`validate_container_number`)
    - **Validate air waybill** — Checks the check digit of an air waybill number and reads its airline prefix. (`validate_air_waybill`)
  collapsible: true
- component_id: steps_dangerous_goods
  type: markdown
  title: Dangerous goods (ADR) (8)
  body: |
    UN numbers, the ADR 1.1.3.6 exemption, limited and excepted quantities, consignment checks, Table A codes and what ADR 2027 changes.

    - **Look up dangerous goods** — Finds ADR Table A entries by UN number, name or hazard class, or several UN numbers at once, with the ADR 2025 or 2027 edition. (`look_up_dangerous_goods`)
    - **Check ADR exemption for one substance** — Works out the ADR 1.1.3.6 points for one UN number and quantity and says whether the small-load exemption applies. (`check_adr_exemption_for_substance`)
    - **Check ADR exemption for a load** — Works out the ADR 1.1.3.6 points for a mixed load of several substances and says whether the small-load exemption applies. (`check_adr_exemption_for_load`)
    - **Check limited or excepted quantities** — Checks items against the ADR limited quantity (3.4) or excepted quantity (3.5) limits. (`check_limited_quantities`)
    - **List ADR codes** — Lists the ADR Table A code families, or the codes of one family, with what each means. (`list_adr_codes`)
    - **Get ADR code** — Reads one ADR Table A code (special provision, packing instruction, tank code and others) and what it means. (`get_adr_code`)
    - **Check ADR consignment** — Checks a whole dangerous-goods consignment: 1.1.3.6, LQ/EQ, tunnels, document strings and mixed loading. (`check_adr_consignment`)
    - **Check ADR 2027 changes** — Lists what ADR 2027 changes for each UN number you give. (`check_adr_2027_changes`)
  collapsible: true
- component_id: steps_calculators
  type: markdown
  title: Freight calculators (6)
  body: |
    Loading metres, CBM, chargeable weight, pallet fitting, unit conversion and ISO 14083 / GLEC emissions.

    - **Calculate loading metres** — Works out the loading metres (LDM) of pallets on a truck or trailer and whether they fit. (`calculate_loading_metres`)
    - **Calculate CBM** — Works out the volume of pieces in cubic metres, litres and cubic feet. (`calculate_cbm`)
    - **Calculate chargeable weight** — Works out the air or sea chargeable weight from dimensions and gross weight. (`calculate_chargeable_weight`)
    - **Calculate pallet fitting** — Works out how many boxes fit on a pallet, per layer and in total. (`calculate_pallet_fitting`)
    - **Convert units** — Converts weights, volumes and lengths, including freight units such as chargeable kg and freight tonnes. (`convert_units`)
    - **Calculate emissions** — Works out the CO2e of a shipment by mass, distance and transport mode under ISO 14083 and the GLEC Framework. (`calculate_emissions`)
  collapsible: true
- component_id: steps_consignments
  type: markdown
  title: Consignments and bookings (4)
  body: |
    Whole loads at once: totals per line, a shipment summary, a booking check and the consignment object.

    - **Calculate consignment** — Totals a multi-line consignment: volume, weights, chargeable weight and loading metres per line and in total. (`calculate_consignment`)
    - **Summarize shipment** — Summarizes a shipment in one answer: totals, chargeable weight, dangerous goods, duty inputs and emissions. (`summarize_shipment`)
    - **Validate consignment** — Validates a consignment object against its schema and says what is wrong in it. (`validate_consignment`)
    - **Check booking** — Checks a road booking: what it lacks, what the job needs and what to ask the customer. (`check_booking`)
  collapsible: true
- component_id: steps_customs
  type: markdown
  title: Customs and tariffs (5)
  body: |
    HS codes, UK duty and VAT, EU TARIC measures and duty, and the ICS2 goods description check.

    - **Look up HS codes** — Finds HS 2022 codes by code, description or section, or several codes at once. (`look_up_hs_codes`)
    - **Estimate UK duty** — Estimates UK import duty and VAT for a commodity code, origin and customs value from the UK Trade Tariff. (`estimate_uk_duty`)
    - **Look up EU tariff** — Lists the EU TARIC measures on a CN or TARIC code for a date and origin. (`look_up_eu_tariff`)
    - **Calculate EU duty** — Calculates EU customs duty from every TARIC measure on the code for the origin and value. (`calculate_eu_duty`)
    - **Check ICS2 goods description** — Screens a goods description against the ICS2 list of vague words customs refuse. (`check_ics2_description`)
  collapsible: true
- component_id: steps_locations
  type: markdown
  title: Locations and carriers (4)
  body: |
    UN/LOCODE transport locations, airports, the nearest airports to a point and airline codes.

    - **Look up airlines** — Finds airlines by IATA or ICAO code, AWB prefix, name or country. (`look_up_airlines`)
    - **Look up UN/LOCODE locations** — Finds ports, terminals and other transport locations by UN/LOCODE, name or country. (`look_up_locations`)
    - **Look up airports** — Finds airports by IATA or ICAO code, name or type. (`look_up_airports`)
    - **Find nearest airports** — Finds the airports nearest to a latitude and longitude. (`find_nearest_airports`)
  collapsible: true
- component_id: steps_equipment
  type: markdown
  title: Equipment (3)
  body: |
    Shipping containers, air cargo ULDs and road vehicles and trailers.

    - **Look up containers** — Reads shipping container sizes and capacities, and how many items of a size fit in one. (`look_up_containers`)
    - **Look up ULDs** — Reads air cargo unit load devices (ULDs) by code, category or deck. (`look_up_ulds`)
    - **Look up vehicles** — Reads road vehicle and trailer types with their dimensions and payloads. (`look_up_vehicles`)
  collapsible: true
- component_id: steps_references
  type: markdown
  title: Identifiers and references (5)
  body: |
    Container, air waybill and IMO number checks, free-text resolution, Incoterms 2020 and customs code lists.

    - **Look up Incoterms** — Reads Incoterms 2020 rules: who pays, who carries the risk and where it passes. (`look_up_incoterms`)
    - **Validate identifiers** — Checks container numbers (ISO 6346), air waybills and IMO numbers, one at a time or every one found in a text. (`validate_identifiers`)
    - **Resolve reference** — Identifies any freight code or name (UN number, HS code, LOCODE, airport, airline and more) as ranked, cited candidates. (`resolve_reference`)
    - **List code lists** — Lists the customs and trade code lists FreightUtils serves. (`list_code_lists`)
    - **Look up code list** — Finds codes in one code list, such as CDS procedure codes, by code or name. (`look_up_code_list`)
  collapsible: true
- component_id: steps_receipts
  type: markdown
  title: Check receipts (2)
  body: |
    Read the receipt a check stored for your key, or confirm that a receipt exists.

    - **Get check receipt** — Reads the receipt a check stored for your API key: inputs, edition, rules and result. (`get_check_receipt`)
    - **Verify check receipt** — Confirms that a check receipt exists and reads its hash, without its contents. (`verify_check_receipt`)
  collapsible: true
- component_id: steps_data
  type: markdown
  title: Data sources and changes (3)
  body: |
    Which datasets FreightUtils serves, their licensing and what changed in them.

    - **Get data coverage** — Reads which datasets FreightUtils serves, their editions and how they are verified. (`get_data_coverage`)
    - **Get data licensing** — Reads the licensing and attribution of each dataset. (`get_data_licensing`)
    - **List data changes** — Lists what changed in the served datasets since a date or a cursor. (`list_data_changes`)
