page_id: api-coverage
title: API coverage
description: Every FreightUtils operation, the step that calls it and its inputs.
project_scoped: false
components:
- component_id: coverage_summary
  type: markdown
  title: Coverage
  body: |
    The pinned FreightUtils OpenAPI 3.1.0 description (API version 1.0.0) lists **40 operations: all 40 have their own step**.

    - Every step reads. The POST operations are calculators and checks: they send the inputs to be checked and change nothing.
    - Not a step: creating an API key (POST /api/keys/register, done once on freightutils.com, see Setup Guide) and the hosted MCP server.
    - No step reads a whole dataset: answers come per question, as FreightUtils' terms require.

    Operations by group:

    - Dangerous goods (ADR): 8
    - Freight calculators: 6
    - Consignments and bookings: 4
    - Customs and tariffs: 5
    - Locations and carriers: 4
    - Equipment: 3
    - Identifiers and references: 5
    - Check receipts: 2
    - Data sources and changes: 3
- component_id: coverage_dangerous_goods
  type: markdown
  title: Dangerous goods (ADR) (8)
  body: |
    - **Look up dangerous goods** (`look_up_dangerous_goods`) — `GET /api/adr`. Inputs: optional un, search, q, class, offset, limit, un_numbers, include_codes, include, edition, as_of, envelope, client, if_stale. Answers: 200, 400, 424, 429.
    - **Check ADR exemption for one substance** (`check_adr_exemption_for_substance`) — `GET /api/adr-calculator`. Inputs: required **un**, **qty**; optional packing_group, variant_index, unit, basis, edition, as_of, envelope, client, if_stale. Answers: 200, 400, 424, 429.
    - **Check ADR exemption for a load** (`check_adr_exemption_for_load`) — `POST /api/adr-calculator`. Inputs: optional items, edition, as_of, consignment, envelope, client, if_stale. Answers: 200, 400, 424, 429.
    - **Check limited or excepted quantities** (`check_limited_quantities`) — `POST /api/adr/lq-check`. Inputs: required **items**; optional mode, edition, as_of, envelope, client, if_stale. Answers: 200, 400, 405, 424, 429.
    - **List ADR codes** (`list_adr_codes`) — `GET /api/adr/codes`. Inputs: optional family, page, envelope, client, if_stale. Answers: 200, 400, 424, 429.
    - **Get ADR code** (`get_adr_code`) — `GET /api/adr/codes/{family}/{code}`. Inputs: required **family**, **code**; optional envelope, client, if_stale. Answers: 200, 400, 404, 424, 429.
    - **Check ADR consignment** (`check_adr_consignment`) — `POST /api/adr/consignment-check`. Inputs: required **lines**; optional journey, vehicle, options, edition, as_of, envelope, if_stale. Answers: 200, 400, 422, 424, 429.
    - **Check ADR 2027 changes** (`check_adr_2027_changes`) — `GET /api/adr/changes-2027`. Inputs: required **un**; optional envelope. Answers: 200, 400, 401, 429.
  collapsible: true
- component_id: coverage_calculators
  type: markdown
  title: Freight calculators (6)
  body: |
    - **Calculate loading metres** (`calculate_loading_metres`) — `GET /api/ldm`. Inputs: optional pallet, length, width, qty, stackable, stack, weight, vehicle, vehicle_length, envelope, client, if_stale. Answers: 200, 400, 424, 429.
    - **Calculate CBM** (`calculate_cbm`) — `GET /api/cbm`. Inputs: required **l**, **w**, **h**; optional pcs, envelope, client. Answers: 200, 400, 429.
    - **Calculate chargeable weight** (`calculate_chargeable_weight`) — `GET /api/chargeable-weight`. Inputs: required **l**, **w**, **h**, **gw**; optional pcs, factor, mode, envelope, client. Answers: 200, 400, 429.
    - **Calculate pallet fitting** (`calculate_pallet_fitting`) — `GET /api/pallet`. Inputs: required **pl**, **pw**, **pmh**, **bl**, **bw**, **bh**; optional ph, bwt, mpw, rotate, envelope, client. Answers: 200, 400, 429.
    - **Convert units** (`convert_units`) — `GET /api/convert`. Inputs: required **value**, **from**, **to**; optional envelope, client. Answers: 200, 400, 429.
    - **Calculate emissions** (`calculate_emissions`) — `GET /api/emissions`. Inputs: required **mass**, **distance_km**, **mode**; optional mass_unit, sub_mode, region, basis, envelope, client, if_stale. Answers: 200, 400, 424, 429.
  collapsible: true
- component_id: coverage_consignments
  type: markdown
  title: Consignments and bookings (4)
  body: |
    - **Calculate consignment** (`calculate_consignment`) — `POST /api/consignment`. Inputs: optional mode, lines, items, options, edition, as_of, consignment, envelope, client, if_stale. Answers: 200, 400, 424, 429.
    - **Summarize shipment** (`summarize_shipment`) — `POST /api/shipment/summary`. Inputs: optional mode, items, origin, destination, incoterm, freight_cost, insurance_cost, edition, as_of, consignment, envelope, client, if_stale. Answers: 200, 400, 405, 424, 429.
    - **Validate consignment** (`validate_consignment`) — `POST /api/validate`. Inputs: required **type**, **consignment**; optional envelope, client, if_stale. Answers: 200, 400, 424, 429.
    - **Check booking** (`check_booking`) — `POST /api/booking-check`. Inputs: optional mode, origin, destination, pieces, vehicle, dangerous_goods, date, tunnels_on_route, detail, envelope. Answers: 200, 400, 429.
  collapsible: true
- component_id: coverage_customs
  type: markdown
  title: Customs and tariffs (5)
  body: |
    - **Look up HS codes** (`look_up_hs_codes`) — `GET /api/hs`. Inputs: optional q, code, section, codes, envelope, client, if_stale. Answers: 200, 400, 404, 424, 429.
    - **Estimate UK duty** (`estimate_uk_duty`) — `POST /api/duty`. Inputs: optional commodity_code, origin_country, customs_value, freight_cost, insurance_cost, incoterm, lines, envelope, client, if_stale. Answers: 200, 400, 404, 424, 429, 503.
    - **Look up EU tariff** (`look_up_eu_tariff`) — `GET /api/eu-tariff`. Inputs: required **code**, **as_of**; optional origin, direction, envelope. Answers: 200, 400, 404, 422, 429.
    - **Calculate EU duty** (`calculate_eu_duty`) — `POST /api/eu-duty`. Inputs: required **code**, **as_of**, **origin**, **customs_value**; optional currency, quantities, envelope. Answers: 200, 400, 404, 422, 429.
    - **Check ICS2 goods description** (`check_ics2_description`) — `GET /api/ics2-check`. Inputs: required **description**; optional envelope, client, if_stale. Answers: 200, 400, 424, 429.
  collapsible: true
