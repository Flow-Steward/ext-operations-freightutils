- operation_id: check_adr_exemption_for_substance
  display_name: Check ADR exemption for one substance
  description: 'Works out the ADR 1.1.3.6 points for one UN number and quantity and says whether the small-load
    exemption applies. FreightUtils: GET /api/adr-calculator.'
  operation_kind: source
  category: logistics
  connection_type_ids:
  - freightutils
  workflow_visible: true
  inputs:
  - name: connection_ref
    value_type: connection_ref
    required: true
  - name: un
    value_type: text
    required: true
    schema:
      type: string
      title: UN number
      description: 'UN number of the substance — or an ID-prefixed air-only number (e.g. ID8000): no ADR
        Table A entry, so it is routed AIR_ONLY_ID and nothing is counted for it — the ADR answer for
        limited-quantity packages to the ICAO TI (3.4.9, 3.4.10, 1.1.3.6.5), as its warni…'
  - name: qty
    value_type: number
    required: true
    schema:
      type: number
      title: Quantity (kg or litres)
      description: 'Quantity on the ADR 1.1.3.6.3 basis: net kg for solids and liquefied, refrigerated
        or dissolved gases; litres for liquids; receptacle water capacity in litres for compressed or
        adsorbed gases and chemicals under pressure.'
      maximum: 1000000000
  - name: packing_group
    value_type: text
    required: false
    schema:
      type: string
      title: Packing group
      description: Packing group (I, II or III) — only needed for a UN number with more than one ADR Table
        A row (e.g. UN 1789); ignored for single-row UNs. Without it a multi-variant UN returns candidates[]
        and no verdict.
      enum:
      - I
      - II
      - III
  - name: variant_index
    value_type: integer
    required: false
    schema:
      type: integer
      title: Variant index
      description: ADR Table A variant index (as returned by /api/adr) — pins one row when a UN number
        has several variants sharing a packing group (concentration bands). Ignored for single-row UN
        numbers. Digits only; anything else is a 400.
      minimum: 0
  - name: unit
    value_type: text
    required: false
    schema:
      type: string
      title: Unit
      description: OPTIONAL dimension of qty. Omit it and qty is taken as already on the 1.1.3.6.3 basis
        (unchanged). Supply it and it is checked against the dimension the row is counted in; a mismatch
        returns points, total_points and exempt all null with basis_mismatch true.
      enum:
      - L
      - kg
  - name: basis
    value_type: text
    required: false
    schema:
      type: string
      title: Basis
      description: OPTIONAL. ADR 1.1.3.6.3 counts the dangerous goods themselves, never the packaging,
        so a figure declared "gross" returns no points in ANY unit — send the net quantity instead.
      enum:
      - net
      - gross
  - name: edition
    value_type: text
    required: false
    schema:
      type: string
      title: Edition
      description: 'ADR edition "2025" or "2027"; wins over as_of. Omitted, as_of picks it: before 2027-01-01
        ADR 2025; to 2027-06-30 ADR 2027 with an EDITION_TRANSITIONAL notice (ADR 2025 still allowed,
        1.6.1.1).'
      enum: *id005
  - name: as_of
    value_type: text
    required: false
    schema:
      type: string
      title: Date
      description: YYYY-MM-DD the answer is for (default today, UTC). Picks the ADR edition when edition
        is omitted; echoed in adr_edition, the 1.2 envelope and the check receipt.
      pattern: ^\d{4}-\d{2}-\d{2}$
  - name: envelope
    value_type: text
    required: false
    schema:
      type: string
      title: Response envelope
      description: 'Response envelope: 1 (byte-stable), 1.1, or 1.2 (adds status, missing_inputs, edition,
        as_of). Omit for the plain body.'
      enum: *id004
  - name: client
    value_type: text
    required: false
    schema:
      type: string
      title: Caller label
      description: Optional caller label (up to 40 characters of A-Za-z0-9._-) so your calls are recognisable
        in our usage figures. Changes no answer. The X-FreightUtils-Client header does the same.
      maxLength: 40
      pattern: ^[A-Za-z0-9._-]{1,40}$
  - name: if_stale
    value_type: text
    required: false
    schema:
      type: string
      title: If data is stale
      description: 'refuse: answer HTTP 424 (stale_upstream) instead of serving stale while a dataset
        of this answer missed its upstream check window. Omit it (the default) to be served from the last
        verified edition with stale: true.'
      enum: *id006
  outputs: *id002
  result_fields:
  - result.status
  - result.data
  - result.text
  - result.source
  - result.citation
  - result.upstream
  - result.rate_limit
  - result.warnings
  error_codes: *id003
