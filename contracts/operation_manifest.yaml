  - name: envelope
    value_type: text
    required: false
    schema:
      type: string
      title: Response envelope
      description: This route answers in envelope 1.2 only; leave it out or send 1.2.
      enum:
      - '1.2'
  - name: if_stale
    value_type: text
    required: false
    schema:
