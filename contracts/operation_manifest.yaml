- operation_id: look_up_dangerous_goods
  display_name: Look up dangerous goods
  description: 'Finds ADR Table A entries by UN number, name or hazard class, or several UN numbers at
    once, with the ADR 2025 or 2027 edition. FreightUtils: GET /api/adr.'
  operation_kind: source
  category: logistics
  connection_type_ids:
  - freightutils
  workflow_visible: true
  inputs:
  - name: connection_ref
    value_type: connection_ref
    required: true
  - name: un
    value_type: text
    required: false
    schema:
      type: string
      title: UN number
      description: UN number to look up (e.g. 1203, UN1203 or UN 1203).
  - name: search
    value_type: text
    required: false
    schema:
      type: string
      title: Search
      description: Search term to find substances by name.
      maxLength: 200
  - name: q
    value_type: text
    required: false
    schema:
      type: string
      title: Search
      description: 'Case-insensitive partial match on the proper shipping name (min 2 characters). A paged
        list: total, truncated, next_offset; no match is a 404 with suggestions — the closest proper shipping
        names in Table A.'
      maxLength: 200
  - name: class
    value_type: text
    required: false
    schema:
      type: string
      title: Class
      description: 'ADR hazard class (Table A column (3a)), e.g. 3, 6.1, 8. A paged list: total, truncated,
        next_offset.'
  - name: offset
    value_type: integer
    required: false
    schema:
      type: integer
      title: Offset
      description: 'Name search / class filter only: rows to skip (default 0). The response gives total,
        truncated and next_offset.'
      minimum: 0
  - name: limit
    value_type: integer
    required: false
    schema:
      type: integer
      title: Limit
      description: 'Name search / class filter only: rows per page — 1 to 50 for a search (default 50),
        1 to 100 for a class (default 100).'
      minimum: 1
      maximum: 100
  - name: un_numbers
    value_type: text
    required: false
    schema:
      type: string
      title: UN numbers
      description: 'Batch: up to 50 UN numbers, comma-separated. Answered as results[] in input order,
        each with its own status; send alone. One call against the daily budget, N against the Pro monthly
        allowance.'
  - name: include_codes
    value_type: text
    required: false
    schema:
      type: string
      title: Include codes
      description: 'none | compact | full — resolved_codes beside results: each Table A code once per
        answer, with the rows that carry it. Default compact for un, none for search, class and un_numbers.'
      enum:
      - none
      - compact
      - full
  - name: include
    value_type: text
    required: false
    schema:
      type: string
      title: Include
      description: 'statements — adds statements[] to every row: plain-word statements (tunnel, transport
        category, labels, packing, tanks, carriage) assembled from the code meanings and the 8.6.4 and
        1.1.3.6.3 tables, each with basis, codes and verification_status.'
      enum:
      - statements
  - name: edition
    value_type: text
    required: false
    schema:
      type: string
      title: Edition
      description: 'ADR edition "2025" or "2027"; wins over as_of. Omitted, as_of picks it: before 2027-01-01
        ADR 2025; to 2027-06-30 ADR 2027 with an EDITION_TRANSITIONAL notice (ADR 2025 still allowed,
        1.6.1.1).'
      enum: *id005
  - name: as_of
    value_type: text
    required: false
    schema:
      type: string
      title: Date
      description: YYYY-MM-DD the answer is for (default today, UTC). Picks the ADR edition when edition
        is omitted; echoed in adr_edition, the 1.2 envelope and the check receipt.
      pattern: ^\d{4}-\d{2}-\d{2}$
  - name: envelope
