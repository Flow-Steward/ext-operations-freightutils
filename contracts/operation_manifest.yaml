    value_type: connection_ref
    required: true
  - name: lines
    value_type: array
    required: true
    schema:
      type: array
      title: Lines
      description: The lines of the load. Required.
      items:
        type: object
        additionalProperties: true
  - name: journey
    value_type: object
    required: false
    schema:
      type: object
      title: Journey
      description: 'The journey: date, route and tunnels, as FreightUtils documents it.'
      additionalProperties: true
  - name: vehicle
    value_type: object
    required: false
    schema:
      type: object
      title: Vehicle
      description: The vehicle, as FreightUtils documents it for this step.
      additionalProperties: true
  - name: options
    value_type: object
    required: false
    schema:
      type: object
      title: Options
      description: Extra options, as FreightUtils documents them for this step.
      additionalProperties: true
  - name: edition
    value_type: text
    required: false
    schema:
      type: string
      title: Edition
      description: ADR edition; wins over the date. /api-docs#adr-editions
      enum:
