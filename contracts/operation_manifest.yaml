- operation_id: check_booking
  display_name: Check booking
  description: 'Checks a road booking: what it lacks, what the job needs and what to ask the customer.
    FreightUtils: POST /api/booking-check.'
  operation_kind: source
  category: logistics
  connection_type_ids:
  - freightutils
  workflow_visible: true
  inputs:
  - name: connection_ref
    value_type: connection_ref
    required: true
  - name: mode
    value_type: text
    required: false
    schema:
      type: string
      title: Mode
      description: Transport mode. This version answers road only; air and sea are refused by name.
      enum:
      - road
  - name: origin
    value_type: text
    required: false
    schema:
      type: string
      title: Origin
      description: A UN/LOCODE (5 characters), an IATA airport code (3 letters) or an ISO 3166 alpha-2
        country code.
  - name: destination
    value_type: text
    required: false
    schema:
      type: string
      title: Destination
      description: As origin.
  - name: pieces
    value_type: array
    required: false
    schema:
      type: array
      title: Pieces
      description: 'The pieces: { quantity, dims { l, w, h, unit: mm|cm|m|in }, weight { value, unit:
        kg|g|t|lb } per piece, stackable? } — the consignment calculator''s line.'
      items:
        type: object
        additionalProperties: true
  - name: vehicle
    value_type: text
    required: false
    schema:
      type: string
      title: Vehicle
      description: The booked vehicle, as a /api/vehicles slug (standard-curtainsider, 7-5t-rigid, luton-van
        …).
  - name: dangerous_goods
    value_type: array
    required: false
    schema:
      type: array
      title: Dangerous goods
      description: Dangerous-goods lines exactly as POST /api/adr/consignment-check takes lines[].
      items:
        type: object
        additionalProperties: true
  - name: date
    value_type: text
    required: false
    schema:
      type: string
      title: Date
      description: Date of carriage for the dangerous-goods check (picks the ADR edition).
      pattern: ^\d{4}-\d{2}-\d{2}$
  - name: tunnels_on_route
    value_type: array
    required: false
    schema:
      type: array
      title: Tunnels on route
      description: Tunnel categories on the route (B–E) for the dangerous-goods check.
      items:
        type: string
  - name: detail
    value_type: boolean
    required: false
    schema:
      type: boolean
      title: Detail
      description: true adds each engine's full answer (result.detail) and the receipt's hashed fields.
        Default false.
  - name: envelope
    value_type: text
    required: false
    schema:
      type: string
      title: Response envelope
      description: This route answers in envelope 1.2 only; leave it out or send 1.2.
      enum:
      - '1.2'
  outputs: *id002
  result_fields:
  - result.status
  - result.data
  - result.text
  - result.source
  - result.citation
  - result.upstream
  - result.rate_limit
  - result.warnings
  error_codes: *id003
