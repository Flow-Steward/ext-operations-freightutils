- operation_id: list_data_changes
  display_name: List data changes
  description: 'Lists what changed in the served datasets since a date or a cursor. FreightUtils: GET
    /api/changes.'
  operation_kind: source
  category: logistics
  connection_type_ids:
  - freightutils
  workflow_visible: true
  inputs:
  - name: connection_ref
    value_type: connection_ref
    required: true
  - name: since
    value_type: text
    required: false
    schema:
      type: string
      title: Since
      description: 'Start at the first release recorded at or after this instant: a UTC date YYYY-MM-DD
        or a UTC timestamp YYYY-MM-DDTHH:MM:SSZ. A filter — continue with next_cursor. Before history_starts,
        full_refresh_required is true. Any other form is refused (400).'
  - name: cursor
    value_type: text
    required: false
    schema:
      type: string
      title: Cursor
      description: The next_cursor a previous answer gave (r<release>.<offset>); the sync key. Not with
        since.
      pattern: ^r\d{1,6}\.\d{1,7}$
  - name: limit
    value_type: integer
    required: false
    schema:
      type: integer
      title: Limit
      description: Items per page, 1–1000 (default 1000). An item is one record event, or one dataset-level
        block.
      minimum: 1
      maximum: 1000
  - name: format
    value_type: text
    required: false
    schema:
      type: string
      title: Format
      description: json (default) or rss — RSS 2.0, one item per dataset per release, each linking to
        the JSON at its release cursor.
      enum:
      - json
      - rss
  - name: envelope
    value_type: text
    required: false
    schema:
      type: string
      title: Response envelope
      description: 'Not used here: the answer is always the feed, with or without it.'
      enum:
      - '1'
      - '1.1'
      - '1.2'
