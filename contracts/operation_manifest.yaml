- operation_id: look_up_code_list
  display_name: Look up code list
  description: 'Finds codes in one code list, such as CDS procedure codes, by code or name. FreightUtils:
    GET /api/codes/{list}.'
  operation_kind: source
  category: logistics
  connection_type_ids:
  - freightutils
  workflow_visible: true
  inputs:
  - name: connection_ref
    value_type: connection_ref
    required: true
  - name: list
    value_type: text
    required: true
    schema:
      type: string
      title: List
      description: 'The list id: cds-procedure-codes-imports, cds-procedure-codes-exports, cds-additional-procedure-codes-imports
        or cds-additional-procedure-codes-exports (GET /api/codes lists them).'
  - name: code
    value_type: text
    required: false
    schema:
      type: string
      title: Code
      description: One code, as published (e.g. 4000, C07). Not with q.
  - name: q
    value_type: text
    required: false
    schema:
      type: string
      title: Search
      description: 'Search within this list (1-100 characters): exact code, then code prefix, then name.'
      minLength: 1
      maxLength: 100
  - name: full
    value_type: boolean
    required: false
    schema:
      type: boolean
      title: Full
      description: 'true: full rows (heading, list and edition on each), 5 per page by default (max 25).
        Default: summary rows, 50 per page (max 200).'
  - name: offset
    value_type: integer
    required: false
    schema:
      type: integer
      title: Offset
      description: Page start for a list or a search (default 0).
      minimum: 0
  - name: limit
    value_type: integer
    required: false
    schema:
      type: integer
      title: Limit
      description: 'Rows per page: 1-200 for summary rows, 1-25 with full=true.'
      minimum: 1
      maximum: 200
  - name: include_deprecated
    value_type: boolean
    required: false
    schema:
      type: boolean
      title: Include deprecated codes
      description: 'true: also list and search codes the publisher marks as no longer to be used. No list
        served today marks one.'
