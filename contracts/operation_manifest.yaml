- operation_id: check_adr_consignment
  display_name: Check ADR consignment
  description: 'Checks a whole dangerous-goods consignment: 1.1.3.6, LQ/EQ, tunnels, document strings
    and mixed loading. FreightUtils: POST /api/adr/consignment-check.'
  operation_kind: source
  category: logistics
  connection_type_ids:
  - freightutils
  workflow_visible: true
  inputs:
