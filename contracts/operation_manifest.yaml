- operation_id: look_up_airlines
  display_name: Look up airlines
  description: 'Finds airlines by IATA or ICAO code, AWB prefix, name or country. FreightUtils: GET /api/airlines.'
  operation_kind: source
  category: logistics
  connection_type_ids:
  - freightutils
  workflow_visible: true
  inputs:
  - name: connection_ref
    value_type: connection_ref
    required: true
  - name: q
    value_type: text
    required: false
    schema:
      type: string
      title: Search
      description: General search term (matches airline name, codes, and country).
      maxLength: 200
  - name: iata
    value_type: text
    required: false
    schema:
      type: string
      title: IATA code
      description: 2-character IATA airline code.
  - name: icao
    value_type: text
    required: false
    schema:
      type: string
      title: ICAO code
      description: 3-character ICAO airline code.
  - name: prefix
    value_type: text
    required: false
    schema:
      type: string
      title: Prefix
      description: 3-digit AWB prefix number.
  - name: country
    value_type: text
    required: false
    schema:
      type: string
      title: Country
      description: Country name to filter airlines by.
  - name: slug
    value_type: text
    required: false
    schema:
      type: string
      title: Slug
      description: Exact FreightUtils record slug — the segment of the record's fu_id (fu:airline:<slug>).
        The one exact lookup for an airline that carries no usable IATA / ICAO code or AWB prefix; the
        api_url of an airline_slug resolve candidate. Answers the one record in full.
      pattern: ^[a-z0-9][a-z0-9-]{0,99}$
  - name: view
    value_type: text
    required: false
    schema:
      type: string
      title: View
      description: view=summary returns summary rows (a subset of each record's fields) with detail_hint;
        the default is the full rows.
      enum:
      - summary
  - name: offset
    value_type: integer
    required: false
    schema:
      type: integer
      title: Offset
      description: 'List paging: rows to skip (default 0). With offset or limit the answer states total,
        truncated and next_offset.'
