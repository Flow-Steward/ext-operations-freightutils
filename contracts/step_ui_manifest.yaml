    widget_type: date
    required: false
    help_text: YYYY-MM-DD the answer is for (default today, UTC). Picks the ADR edition when edition is
      omitted; echoed in adr_edition, the 1.2 envelope and the check receipt.
  - name: envelope
    label: Response envelope
    widget_type: select
    required: false
    help_text: 'Response envelope: 1 (byte-stable), 1.1, or 1.2 (adds status, missing_inputs, edition,
