- operation_id: check_adr_exemption_for_substance
  title: Check ADR exemption for one substance
  fields:
  - name: un
    label: UN number
    widget_type: text
    required: true
    help_text: 'UN number of the substance — or an ID-prefixed air-only number (e.g. ID8000): no ADR Table
      A entry, so it is routed AIR_ONLY_ID and nothing is counted for it — the ADR answer for limited-quantity
      packages to the ICAO TI (3.4.9, 3.4.10, 1.1.3.6.5), as its warni…'
  - name: qty
    label: Quantity (kg or litres)
    widget_type: number
    required: true
    help_text: 'Quantity on the ADR 1.1.3.6.3 basis: net kg for solids and liquefied, refrigerated or
      dissolved gases; litres for liquids; receptacle water capacity in litres for compressed or adsorbed
      gases and chemicals under pressure.'
  - name: packing_group
    label: Packing group
    widget_type: select
    required: false
    help_text: Packing group (I, II or III) — only needed for a UN number with more than one ADR Table
      A row (e.g. UN 1789); ignored for single-row UNs. Without it a multi-variant UN returns candidates[]
      and no verdict.
    options:
    - value: I
      label: I
    - value: II
      label: II
    - value: III
      label: III
  - name: variant_index
    label: Variant index
    widget_type: integer
    required: false
    help_text: ADR Table A variant index (as returned by /api/adr) — pins one row when a UN number has
      several variants sharing a packing group (concentration bands). Ignored for single-row UN numbers.
      Digits only; anything else is a 400.
  - name: unit
    label: Unit
    widget_type: select
    required: false
    help_text: OPTIONAL dimension of qty. Omit it and qty is taken as already on the 1.1.3.6.3 basis (unchanged).
      Supply it and it is checked against the dimension the row is counted in; a mismatch returns points,
      total_points and exempt all null with basis_mismatch true.
    options:
    - value: L
      label: L
    - value: kg
      label: kg
  - name: basis
    label: Basis
    widget_type: select
    required: false
    help_text: OPTIONAL. ADR 1.1.3.6.3 counts the dangerous goods themselves, never the packaging, so
      a figure declared "gross" returns no points in ANY unit — send the net quantity instead.
    options:
    - value: net
      label: net
    - value: gross
      label: gross
  - name: edition
    label: Edition
    widget_type: select
    required: false
    help_text: 'ADR edition "2025" or "2027"; wins over as_of. Omitted, as_of picks it: before 2027-01-01
      ADR 2025; to 2027-06-30 ADR 2027 with an EDITION_TRANSITIONAL notice (ADR 2025 still allowed, 1.6.1.1).'
